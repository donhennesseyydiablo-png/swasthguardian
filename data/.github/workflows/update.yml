name: Auto-update supplement data
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update date
        run: |
          today=$(date +'%Y-%m-%d')
          jq '.items |= map(.updated="'$today'")' data/products.json > tmp.json && mv tmp.json data/products.json
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/products.json
          git commit -m "Daily update" || echo "No changes"
          git push
