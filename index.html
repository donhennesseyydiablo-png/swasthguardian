<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwasthGuardian Ultimate</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; }
::placeholder { color: #9ca3af; }
</style>
</head>
<body class="bg-gray-900 text-gray-100">

<!-- Hero Section -->
<div class="max-w-6xl mx-auto p-6 text-center">
  <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1200" class="rounded-xl w-full mb-6 shadow-lg" alt="Herbal Supplements">
  <h1 class="text-4xl font-extrabold mb-2 text-green-400">🌿 SwasthGuardian Ultimate</h1>
  <p class="text-gray-400 mb-8 text-lg">India’s supplement safety, top products, overdose & pricing info with reasoning</p>
  <input id="search" placeholder="Search brand or ingredient..." class="border p-3 w-full rounded mb-6 text-gray-900 focus:ring-2 focus:ring-green-400" />
</div>

<!-- Charts Section -->
<div class="max-w-6xl mx-auto p-6 mb-6 bg-gray-800 rounded-xl shadow-lg">
  <canvas id="riskChart" class="mb-4"></canvas>
  <canvas id="priceChart" class="mb-4"></canvas>
  <canvas id="topProductsChart" class="mb-4"></canvas>
</div>

<!-- Cards Section -->
<div class="max-w-6xl mx-auto p-6">
  <div id="cards" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<script>
async function load(){
  const res = await fetch('data/products.json?t='+Date.now());
  const data = await res.json();

  // Generate explanation for ChatGPT-style reasoning
  function generateExplanation(product){
    let explanation = '';
    if(product.dosage_mg < product.rda_mg){
      explanation += `⚠ Current dosage ${product.dosage_mg}mg is below RDA ${product.rda_mg}mg. `;
    } else {
      explanation += `✅ Dosage meets daily RDA (${product.rda_mg}mg). `;
    }
    if(product.hidden_underdose_prob > 20){
      explanation += `⚠ Probability of hidden under-dosage/fake labeling: ${product.hidden_underdose_prob}%. `;
    } else {
      explanation += `Low probability (${product.hidden_underdose_prob}%) of hidden under-dosage. `;
    }
    if(product.risk_score > 70) explanation += '❌ High risk product, avoid.';
    else if(product.risk_score > 30) explanation += '⚠ Moderate risk, check carefully.';
    else explanation += '✅ Safe product.';
    return explanation;
  }

  // Risk Chart
  const riskCtx = document.getElementById('riskChart').getContext('2d');
  new Chart(riskCtx,{
    type:'bar',
    data:{
      labels:data.items.map(x=>x.brand),
      datasets:[{label:'Risk Score',data:data.items.map(x=>x.risk_score),backgroundColor:'rgba(220,38,38,0.7)'}]
    },
    options:{responsive:true, plugins:{legend:{labels:{color:'white'}}}, scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'Risk Score',color:'white'}},x:{ticks:{color:'white'}}}}
  });

  // Price Chart
  const priceCtx = document.getElementById('priceChart').getContext('2d');
  new Chart(priceCtx,{
    type:'bar',
    data:{
      labels:data.items.map(x=>x.brand),
      datasets:[{label:'Price ₹',data:data.items.map(x=>x.price),backgroundColor:'rgba(34,197,94,0.7)'}]
    },
    options:{responsive:true, plugins:{legend:{labels:{color:'white'}}}, scales:{y:{beginAtZero:true,title:{display:true,text:'Price ₹',color:'white'}},x:{ticks:{color:'white'}}}}
  });

  // Top Products <₹500 & safe
  const topProducts = data.items.filter(x=>x.price<=500 && x.risk_score<50);
  const topCtx = document.getElementById('topProductsChart').getContext('2d');
  new Chart(topCtx,{
    type:'bar',
    data:{
      labels:topProducts.map(x=>x.brand),
      datasets:[{label:'Safety Score (100-Risk)',data:topProducts.map(x=>100-x.risk_score),backgroundColor:'rgba(59,130,246,0.7)'}]
    },
    options:{responsive:true, plugins:{legend:{labels:{color:'white'}}}, scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'Safety Score',color:'white'}},x:{ticks:{color:'white'}}}}
  });

  // Cards Section
  const cards=document.getElementById('cards');
  const search=document.getElementById('search');
  function render(filter=''){
    cards.innerHTML='';
    data.items.filter(i=>i.brand.toLowerCase().includes(filter.toLowerCase()) || i.ingredient.toLowerCase().includes(filter.toLowerCase()))
      .forEach(i=>{
        let color = i.risk_score>70?'bg-red-800':(i.risk_score>30?'bg-yellow-800':'bg-green-800');
        cards.innerHTML+=`
          <div class="${color} rounded-xl p-4 shadow-lg hover:shadow-green-400/40 transition">
            <h2 class="text-xl font-semibold text-green-300">${i.brand} (${i.ingredient})</h2>
            <p class="text-gray-200 mt-1">${i.risk_reason}</p>
            <p class="mt-2 text-gray-100">Price: ₹${i.price}, Dosage: ${i.dosage_mg}mg (RDA: ${i.rda_mg}mg)</p>
            <p class="mt-2 text-gray-100">Safe Alternative: ${i.safe_alternative}</p>
            <p class="mt-2 font-semibold text-green-200">${generateExplanation(i)}</p>
            <p class="text-xs text-gray-400 mt-2">Updated: ${i.updated}</p>
          </div>`;
      });
  }
  render();
  search.addEventListener('input', e=>render(e.target.value));
}
load();
</script>

</body>
</html>
